[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# The URL is resolved in migrations/env.py from nflfp.config.Settings, so that
# Alembic, the API and the workers cannot end up pointing at different
# databases. Deliberately left blank here — a value in this file would be a
# second source of truth, and the one that silently wins.
sqlalchemy.url =

# Name new revisions by timestamp + slug, so `ls versions/` reads in the order
# they will actually be applied.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
