[project]
name = "nflfp"
version = "0.1.0"
description = "NFL fantasy point projection data layer (nflverse -> DuckDB)"
requires-python = ">=3.10"
dependencies = [
    # ETL: DuckDB reads nflverse parquet and writes Postgres via ATTACH.
    "duckdb>=1.1",
    # One driver for every path — psycopg 3 is both the libpq client used by the
    # pipeline and SQLAlchemy's sync *and* async driver, so pooling and TLS
    # behaviour cannot diverge between the API and the workers.
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    # Layer 5. The API is a thin serialisation of nflfp.services, so FastAPI is
    # a presentation dependency only — nothing below nflfp.api imports it, and
    # the ETL and worker images do not need it at runtime.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Layer 6. One package serves both sides: `redis.asyncio` for the API and
    # the same client for the job path, so timeouts and key handling cannot
    # differ between them. Absent REDIS_URL the cache resolves to NullCache and
    # this is never imported.
    "redis>=5.0",
    # Runtime, not just test: the cache warmer drives the real ASGI app through
    # httpx so a warmed body is by construction the body a user would receive.
    # Warming through a reimplementation of the render path is how a cache
    # starts serving something the API never produced.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a live Postgres (set DATABASE_URL). Deselect with -m 'not integration'.",
]
filterwarnings = ["error::DeprecationWarning:nflfp.*"]
