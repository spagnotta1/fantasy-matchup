<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Weekly NFL fantasy football projections with honest uncertainty: floors, ceilings, matchup grades and head-to-head simulation."
    />
    <!--
      Both values are declared so the browser paints the correct chrome before
      the stylesheet loads. Without this the address bar flashes white on a dark
      device on every cold load.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef1f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16392a" />
    <title>Fourth &amp; Probable — NFL fantasy projections</title>
    <script>
      // Applied before first paint so a dark preference does not flash a light
      // screen. Kept inline and tiny for that reason; the React hook owns it
      // from mount onwards.
      //
      // The attribute is always set, to `light` or `dark`. With nothing stored
      // the OS preference is resolved here, which is what lets the stylesheet
      // define the dark palette once instead of once per way of reaching it.
      ;(function () {
        var theme = null
        try {
          var stored = localStorage.getItem('nflfp.theme')
          if (stored === 'dark' || stored === 'light') theme = stored
        } catch (error) {
          /* Storage unavailable: fall back to the OS preference. */
        }
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
